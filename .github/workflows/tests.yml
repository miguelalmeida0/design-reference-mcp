name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            server/requirements.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q server/app examples/codex/scripts
      - run: python -m pytest -q
      - run: python -m playwright install --with-deps chromium
      - name: Chromium rendering smoke test
        run: PYTHONPATH=server python server/tests/chromium-smoke-test.py
